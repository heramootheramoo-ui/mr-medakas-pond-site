<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr Medaka's Pond — swimming test</title>
<!-- pixel font self-hosted via style.css; no external requests -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" aria-label="Animated medaka swimming in a tub. Tap or click the water to drop food."></canvas>
<div class="hud"><div class="left"><b>Mr Medaka's Pond</b><small id="stats" aria-live="polite">Eaten 0 · Wasted 0</small></div>
<div class="portion" role="radiogroup" aria-label="Portion size"><small>Tap water to feed · portion</small><div class="seg">
<button role="radio" aria-checked="false" data-p="pinch">Pinch</button><button role="radio" aria-checked="true" data-p="small">Small</button><button role="radio" aria-checked="false" data-p="medium">Medium</button><button role="radio" aria-checked="false" data-p="large">Large</button></div></div></div>
<img id="c1" src="assets/water/caustics_a.png" alt="" hidden><img id="c2" src="assets/water/caustics_b.png" alt="" hidden>
<img id="i-youkihi" src="assets/fish/youkihi_iris.png" alt="" hidden><img id="i-miyuki" src="assets/fish/miyuki_iris.png" alt="" hidden><img id="i-sanshoku" src="assets/fish/sanshoku_iris.png" alt="" hidden><img id="i-shirohikari" src="assets/fish/shirohikari_iris.png" alt="" hidden><img id="i-wild" src="assets/fish/wild_iris.png" alt="" hidden><img id="i-youkihihirenaga" src="assets/fish/youkihihirenaga_iris.png" alt="" hidden><img id="i-kurotsubame" src="assets/fish/kurotsubame_iris.png" alt="" hidden><img id="i-youkihidaruma" src="assets/fish/youkihidaruma_iris.png" alt="" hidden>
<img id="bg" src="assets/water/background.jpg" alt="" hidden>
<img id="f-youkihi" src="assets/fish/youkihi_body.png" alt="" hidden><img id="s-youkihi" src="assets/fish/youkihi_shadow.png" alt="" hidden>
<img id="f-miyuki" src="assets/fish/miyuki_body.png" alt="" hidden><img id="s-miyuki" src="assets/fish/miyuki_shadow.png" alt="" hidden>
<img id="f-sanshoku" src="assets/fish/sanshoku_body.png" alt="" hidden><img id="s-sanshoku" src="assets/fish/sanshoku_shadow.png" alt="" hidden>
<img id="f-shirohikari" src="assets/fish/shirohikari_body.png" alt="" hidden><img id="s-shirohikari" src="assets/fish/shirohikari_shadow.png" alt="" hidden>
<img id="f-wild" src="assets/fish/wild_body.png" alt="" hidden><img id="s-wild" src="assets/fish/wild_shadow.png" alt="" hidden>
<img id="f-youkihihirenaga" src="assets/fish/youkihihirenaga_body.png" alt="" hidden><img id="s-youkihihirenaga" src="assets/fish/youkihihirenaga_shadow.png" alt="" hidden>
<img id="f-kurotsubame" src="assets/fish/kurotsubame_body.png" alt="" hidden><img id="s-kurotsubame" src="assets/fish/kurotsubame_shadow.png" alt="" hidden>
<img id="f-youkihidaruma" src="assets/fish/youkihidaruma_body.png" alt="" hidden><img id="s-youkihidaruma" src="assets/fish/youkihidaruma_shadow.png" alt="" hidden>
<button id="tuneBtn" class="tune" aria-expanded="false" aria-controls="panel">Tune movement</button>
<section id="panel" class="panel" hidden aria-label="Movement settings">
<div class="phead"><b>Movement settings</b><button id="closeBtn" class="icon" aria-label="Close settings">✕</button></div>
<div class="scroll">
<h3>Movement</h3><label class="row"><span class="lbl">Burst speed</span><input type="range" id="p-burst" min="100" max="1200" step="10" value="190"><output id="o-burst">190</output><span class="u">px/s</span></label><label class="row"><span class="lbl">Tail beats per burst</span><input type="range" id="p-beats" min="1" max="8" step="0.5" value="3.5"><output id="o-beats">3.5</output><span class="u"></span></label><label class="row"><span class="lbl">Rest between bursts</span><input type="range" id="p-rest" min="0" max="4" step="0.05" value="2.8"><output id="o-rest">2.8</output><span class="u">s</span></label><label class="row"><span class="lbl">Water drag</span><input type="range" id="p-drag" min="0.5" max="10" step="0.1" value="1.8"><output id="o-drag">1.8</output><span class="u"></span></label><label class="row"><span class="lbl">Turn snap speed</span><input type="range" id="p-turn" min="2" max="25" step="0.5" value="14.5"><output id="o-turn">14.5</output><span class="u"></span></label><label class="row"><span class="lbl">Direction randomness</span><input type="range" id="p-wander" min="0" max="2.5" step="0.05" value="2.15"><output id="o-wander">2.15</output><span class="u"></span></label><label class="row"><span class="lbl">Hover twitchiness</span><input type="range" id="p-twitch" min="0" max="6" step="0.1" value="2.1"><output id="o-twitch">2.1</output><span class="u"></span></label><h3>Body and tail</h3><label class="row"><span class="lbl">Tail swing (burst)</span><input type="range" id="p-swing" min="0.05" max="0.9" step="0.01" value="0.42"><output id="o-swing">0.42</output><span class="u"></span></label><label class="row"><span class="lbl">Body sway (resting)</span><input type="range" id="p-sway" min="0" max="0.3" step="0.005" value="0.165"><output id="o-sway">0.165</output><span class="u"></span></label><label class="row"><span class="lbl">Tail beat speed</span><input type="range" id="p-beatHz" min="3" max="20" step="0.5" value="7"><output id="o-beatHz">7</output><span class="u">Hz</span></label><label class="row"><span class="lbl">Resting sway speed</span><input type="range" id="p-idleHz" min="0.5" max="6" step="0.1" value="2.4"><output id="o-idleHz">2.4</output><span class="u">Hz</span></label><label class="row"><span class="lbl">Front body flex</span><input type="range" id="p-flex" min="0" max="0.7" step="0.01" value="0.18"><output id="o-flex">0.18</output><span class="u"></span></label><label class="row"><span class="lbl">Body wave length</span><input type="range" id="p-wave" min="1.5" max="8" step="0.1" value="4.4"><output id="o-wave">4.4</output><span class="u"></span></label><label class="row"><span class="lbl">Tail fin flick</span><input type="range" id="p-finFlick" min="0" max="1.6" step="0.05" value="0.8"><output id="o-finFlick">0.8</output><span class="u"></span></label><label class="row"><span class="lbl">Turn curl</span><input type="range" id="p-curl" min="0" max="0.2" step="0.005" value="0.2"><output id="o-curl">0.2</output><span class="u"></span></label><h3>Schooling</h3><label class="row"><span class="lbl">Personal space</span><input type="range" id="p-space" min="60" max="450" step="5" value="250"><output id="o-space">250</output><span class="u">px</span></label><label class="row"><span class="lbl">Avoidance strength</span><input type="range" id="p-avoid" min="0" max="3" step="0.05" value="1.4"><output id="o-avoid">1.4</output><span class="u"></span></label><label class="row"><span class="lbl">Follow neighbours' direction</span><input type="range" id="p-align" min="0" max="0.8" step="0.01" value="0.12"><output id="o-align">0.12</output><span class="u"></span></label><label class="row"><span class="lbl">Regroup distance</span><input type="range" id="p-regroupDist" min="150" max="1200" step="10" value="310"><output id="o-regroupDist">310</output><span class="u">px</span></label><label class="row"><span class="lbl">Regroup pull</span><input type="range" id="p-regroup" min="0" max="0.9" step="0.01" value="0.11"><output id="o-regroup">0.11</output><span class="u"></span></label><h3>Scene</h3><label class="row"><span class="lbl">Fish size</span><input type="range" id="p-size" min="0.25" max="0.9" step="0.01" value="0.48"><output id="o-size">0.48</output><span class="u"></span></label><label class="row"><span class="lbl">Water ripples</span><input type="range" id="p-ripple" min="0" max="2.5" step="0.05" value="1.0"><output id="o-ripple">1.0</output><span class="u"></span></label>
<h3>Natures</h3><label class="row chk"><input type="checkbox" id="showNat" checked><span>Show nature labels</span></label><label class="row nat"><span class="lbl">Youkihi</span><select data-fish="youkihi" aria-label="Nature of Youkihi"><option value="loving" selected>Loving</option><option value="gentle">Gentle</option><option value="shy">Shy</option><option value="curious">Curious</option><option value="playful">Playful</option><option value="zippy">Zippy</option><option value="leader">Leader</option><option value="feisty">Feisty</option></select></label><label class="row nat"><span class="lbl">Miyuki</span><select data-fish="miyuki" aria-label="Nature of Miyuki"><option value="loving">Loving</option><option value="gentle">Gentle</option><option value="shy">Shy</option><option value="curious">Curious</option><option value="playful">Playful</option><option value="zippy" selected>Zippy</option><option value="leader">Leader</option><option value="feisty">Feisty</option></select></label><label class="row nat"><span class="lbl">Sanshoku</span><select data-fish="sanshoku" aria-label="Nature of Sanshoku"><option value="loving">Loving</option><option value="gentle">Gentle</option><option value="shy">Shy</option><option value="curious">Curious</option><option value="playful" selected>Playful</option><option value="zippy">Zippy</option><option value="leader">Leader</option><option value="feisty">Feisty</option></select></label><label class="row nat"><span class="lbl">Shiro hikari</span><select data-fish="shirohikari" aria-label="Nature of Shiro hikari"><option value="loving">Loving</option><option value="gentle">Gentle</option><option value="shy" selected>Shy</option><option value="curious">Curious</option><option value="playful">Playful</option><option value="zippy">Zippy</option><option value="leader">Leader</option><option value="feisty">Feisty</option></select></label><label class="row nat"><span class="lbl">Wild type</span><select data-fish="wild" aria-label="Nature of Wild type"><option value="loving">Loving</option><option value="gentle">Gentle</option><option value="shy">Shy</option><option value="curious" selected>Curious</option><option value="playful">Playful</option><option value="zippy">Zippy</option><option value="leader">Leader</option><option value="feisty">Feisty</option></select></label><label class="row nat"><span class="lbl">Youkihi hirenaga</span><select data-fish="youkihihirenaga" aria-label="Nature of Youkihi hirenaga"><option value="loving">Loving</option><option value="gentle">Gentle</option><option value="shy">Shy</option><option value="curious">Curious</option><option value="playful">Playful</option><option value="zippy">Zippy</option><option value="leader" selected>Leader</option><option value="feisty">Feisty</option></select></label><label class="row nat"><span class="lbl">Kuro tsubame</span><select data-fish="kurotsubame" aria-label="Nature of Kuro tsubame"><option value="loving">Loving</option><option value="gentle">Gentle</option><option value="shy">Shy</option><option value="curious">Curious</option><option value="playful">Playful</option><option value="zippy">Zippy</option><option value="leader">Leader</option><option value="feisty" selected>Feisty</option></select></label><label class="row nat"><span class="lbl">Youkihi daruma</span><select data-fish="youkihidaruma" aria-label="Nature of Youkihi daruma"><option value="loving">Loving</option><option value="gentle" selected>Gentle</option><option value="shy">Shy</option><option value="curious">Curious</option><option value="playful">Playful</option><option value="zippy">Zippy</option><option value="leader">Leader</option><option value="feisty">Feisty</option></select></label><h3>Your settings</h3>
<p class="hint">Copy this and paste it back into the chat.</p>
<textarea id="out" readonly rows="6" aria-label="Settings to copy"></textarea>
<div class="btns"><button id="copyBtn">Copy settings</button><button id="resetBtn" class="ghost">Reset to defaults</button></div>
</div>
</section>
<script src="game.js"></script>
</body>
</html>
